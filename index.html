<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>DAKICKS Terminal</title>

  <!-- Core SDKs -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://sad.adsgram.ai/js/sad.min.js" defer></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js" defer></script>

  <style>
    :root {
      --bg-base: #060707;
      --surface-card: rgba(18, 20, 19, 0.72);
      --surface-elevated: #111413;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-focus: rgba(255, 255, 255, 0.22);
      --text-main: #ffffff;
      --text-muted: #838d87;
      --accent-active: #ffffff;
      --accent-success: #00e575;
      --accent-danger: #ff4757;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent !important;
      outline: none !important;
      user-select: none;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* Ambient Background Glow */
    .ambient-radial {
      position: absolute;
      top: -120px;
      left: 50%;
      transform: translateX(-50%);
      width: 380px;
      height: 380px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.045) 0%, rgba(0, 0, 0, 0) 70%);
      pointer-events: none;
      z-index: 0;
    }

    div[class*="adsgram"], div[id*="adsgram"] {
      display: none !important;
      opacity: 0 !important;
      pointer-events: none !important;
    }

    /* Header Component */
    .luxury-header {
      height: 60px;
      padding: 0 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(6, 7, 7, 0.85);
      border-bottom: 1px solid var(--border-subtle);
      z-index: 50;
      backdrop-filter: blur(24px);
    }

    .profile-trigger {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }

    .avatar-orb {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #141716;
      border: 1px solid var(--border-focus);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.5px;
      background-size: cover;
      background-position: center;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.6);
      position: relative;
    }

    .avatar-orb::after {
      content: "";
      position: absolute;
      inset: -1px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .profile-meta {
      display: flex;
      flex-direction: column;
    }

    .user-handle-line {
      font-size: 13.5px;
      font-weight: 700;
      letter-spacing: -0.2px;
      max-width: 130px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .status-line {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.6px;
      text-transform: uppercase;
    }

    .system-status {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 11px;
      color: var(--text-muted);
      font-family: -apple-system, monospace;
      padding: 6px 12px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
    }

    .status-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--accent-success);
      box-shadow: 0 0 8px var(--accent-success);
    }

    /* Main Viewport Container */
    .viewport {
      flex: 1;
      position: relative;
      overflow: hidden;
      z-index: 1;
    }

    .screen-tab {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      overflow-y: auto;
      padding: 20px 18px 90px 18px;
      -webkit-overflow-scrolling: touch;
    }

    .screen-tab.active {
      display: flex;
    }

    /* Dashboard Front Stage (Blum-Inspired Minimalist Spacing) */
    .hero-stage {
      padding: 24px 0 16px 0;
      text-align: center;
    }

    .brand-eyebrow {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 3px;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .stage-metric-lead {
      font-size: 34px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #ffffff;
      margin-bottom: 4px;
    }

    .stage-metric-sub {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* Protocol Feature Cards */
    .quick-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin: 22px 0;
    }

    .action-tile {
      background: var(--surface-card);
      border: 1px solid var(--border-subtle);
      border-radius: 18px;
      padding: 16px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      backdrop-filter: blur(20px);
    }

    .tile-glyph {
      width: 22px;
      height: 22px;
      fill: #ffffff;
    }

    .tile-label {
      font-size: 10px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    /* Custom In-House Live Market & Chart Engine */
    .market-section-head {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.8px;
      color: var(--text-muted);
      text-transform: uppercase;
      margin: 16px 0 12px 2px;
    }

    .live-chart-card {
      background: #0d0f0e;
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
      padding: 18px;
      margin-bottom: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .chart-status-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    .active-pair-name {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.2px;
    }

    .active-pair-price {
      font-size: 17px;
      font-weight: 800;
      font-family: -apple-system, monospace;
      color: #ffffff;
    }

    .active-pair-delta {
      font-size: 11px;
      font-weight: 700;
      margin-left: 6px;
    }

    .canvas-wrapper {
      width: 100%;
      height: 140px;
      position: relative;
    }

    #proprietaryCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Currency / Crypto Dynamic Feed List */
    .market-listing-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .market-row-item {
      background: var(--surface-card);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 13px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      backdrop-filter: blur(16px);
      transition: border-color 0.2s;
    }

    .market-row-item.active {
      border-color: var(--border-focus);
      background: rgba(255, 255, 255, 0.04);
    }

    .market-row-left {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .market-symbol {
      font-size: 13.5px;
      font-weight: 800;
      letter-spacing: 0.2px;
    }

    .market-asset-tag {
      font-size: 10px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .market-row-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 2px;
    }

    .market-val {
      font-size: 13px;
      font-weight: 700;
      font-family: -apple-system, monospace;
    }

    .market-change-badge {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .text-up { color: var(--accent-success); }
    .text-down { color: var(--accent-danger); }
    .bg-up { background: rgba(0, 229, 117, 0.12); color: var(--accent-success); }
    .bg-down { background: rgba(255, 71, 87, 0.12); color: var(--accent-danger); }

    /* Allocation & Action Card */
    .institutional-box {
      background: var(--surface-card);
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
      padding: 20px;
      margin-top: 14px;
      backdrop-filter: blur(20px);
    }

    .box-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .box-eyebrow {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .box-metric {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: -0.5px;
      margin-bottom: 16px;
    }

    .btn-luxury-action {
      width: 100%;
      background: #ffffff;
      color: #060707;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 12.5px;
      font-weight: 800;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      cursor: pointer;
    }

    /* Minimal Bottom Navigation Dock */
    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 64px;
      background: rgba(6, 7, 7, 0.92);
      border-top: 1px solid var(--border-subtle);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 90;
      backdrop-filter: blur(24px);
    }

    .dock-tab {
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      color: #4b5550;
      cursor: pointer;
    }

    .dock-tab svg {
      width: 19px;
      height: 19px;
      fill: currentColor;
    }

    .dock-tab.active {
      color: #ffffff;
    }

    .dock-label {
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    /* Apple-Grade Profile Modal Drawer */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.72);
      backdrop-filter: blur(16px);
      z-index: 99990;
      display: none;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.open {
      display: block;
      opacity: 1;
    }

    .profile-drawer {
      position: fixed;
      left: 0;
      right: 0;
      bottom: -100%;
      background: #0e1110;
      border-top: 1px solid var(--border-focus);
      border-radius: 28px 28px 0 0;
      padding: 24px 22px 42px 22px;
      z-index: 99995;
      transition: bottom 0.36s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .profile-drawer.open {
      bottom: 0;
    }

    .sheet-handle {
      width: 36px;
      height: 4px;
      background: rgba(255, 255, 255, 0.18);
      border-radius: 4px;
      margin-bottom: 22px;
    }

    .btn-sheet-close {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(255, 255, 255, 0.06);
      border: none;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      color: #ffffff;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .drawer-photo-wrap {
      position: relative;
      margin-bottom: 14px;
    }

    .drawer-big-avatar {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      background: #141716;
      border: 1.5px solid var(--border-focus);
      color: #ffffff;
      font-size: 26px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      background-size: cover;
      background-position: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.7);
    }

    .edit-photo-trigger {
      position: absolute;
      bottom: 0;
      right: 0;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
    }

    .edit-photo-trigger svg {
      width: 14px;
      height: 14px;
      fill: #060707;
    }

    .drawer-user-title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.3px;
      margin-bottom: 4px;
    }

    .drawer-user-sub {
      font-size: 11px;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.04);
      padding: 4px 12px;
      border-radius: 20px;
      border: 1px solid var(--border-subtle);
      margin-bottom: 18px;
    }

    .flow-guidance-text {
      font-size: 12.5px;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 20px;
      max-width: 320px;
    }

    /* Clean Apple-Style Monochrome Verification Forms */
    .form-segment {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .minimal-text-input {
      width: 100%;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 14px 16px;
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      transition: border-color 0.2s;
    }

    .minimal-text-input:focus {
      border-color: #ffffff;
    }

    .luxury-code-input {
      width: 100%;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-focus);
      border-radius: 12px;
      padding: 15px;
      color: #ffffff;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 8px;
      text-align: center;
      font-family: -apple-system, monospace;
    }

    .luxury-code-input:focus {
      border-color: #ffffff;
      background: rgba(255, 255, 255, 0.06);
    }

    .btn-action-primary {
      width: 100%;
      background: #ffffff;
      color: #060707;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.5px;
      cursor: pointer;
    }

    .verification-sub-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 6px;
    }

    .resend-countdown-text {
      font-size: 11.5px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .action-sub-btn {
      background: transparent;
      border: none;
      color: #ffffff;
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: underline;
      padding: 0;
    }

    .action-sub-btn:disabled {
      color: #4b5550;
      text-decoration: none;
      cursor: not-allowed;
    }

    /* Verified Card State */
    .card-verified-container {
      width: 100%;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-focus);
      border-radius: 14px;
      padding: 16px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-align: left;
    }

    .verified-email-text {
      font-size: 13.5px;
      font-weight: 700;
      color: #ffffff;
    }

    .verified-sub-caption {
      font-size: 10.5px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .verified-seal-pill {
      font-size: 10px;
      font-weight: 800;
      color: #ffffff;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-focus);
      padding: 5px 10px;
      border-radius: 20px;
    }

    /* HUD Toast Notification */
    .toast-hud {
      position: fixed;
      top: 72px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: rgba(18, 20, 19, 0.95);
      border: 1px solid var(--border-focus);
      color: #ffffff;
      padding: 10px 20px;
      border-radius: 30px;
      font-size: 12px;
      font-weight: 700;
      z-index: 999999;
      opacity: 0;
      pointer-events: none;
      backdrop-filter: blur(24px);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    .toast-hud.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    .toast-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ffffff;
    }

    /* First Time Gate Screen */
    .gate-backdrop {
      position: fixed;
      inset: 0;
      background: #060707;
      z-index: 99999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .gate-card-box {
      width: 100%;
      max-width: 360px;
      background: #0e1110;
      border: 1px solid var(--border-focus);
      border-radius: 24px;
      padding: 30px 22px;
      text-align: center;
    }

    .gate-header-title {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .gate-header-desc {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 24px;
    }
  </style>
</head>
<body>

  <div class="ambient-radial"></div>

  <!-- Header -->
  <header class="luxury-header">
    <div class="profile-trigger" id="headerProfileTrigger">
      <div class="avatar-orb" id="topAvatarOrb">DK</div>
      <div class="profile-meta">
        <span class="user-handle-line" id="topUsernameLabel">Terminal User</span>
        <span class="status-line">Verified Protocol</span>
      </div>
    </div>
    <div class="system-status">
      <div class="status-dot"></div>
      <span>Mainnet Ready</span>
    </div>
  </header>

  <!-- Main Viewport -->
  <main class="viewport">
    
    <!-- Tab: Home / Markets -->
    <section id="tab-home" class="screen-tab active">
      
      <div class="hero-stage">
        <div class="brand-eyebrow">Genesis Architecture</div>
        <div class="stage-metric-lead">DAKICKS®</div>
        <div class="stage-metric-sub">Physical Ownership & Liquidity Infrastructure</div>
      </div>

      <div class="quick-grid">
        <div class="action-tile">
          <svg class="tile-glyph" viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
          <span class="tile-label">Apparel</span>
        </div>
        <div class="action-tile">
          <svg class="tile-glyph" viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
          <span class="tile-label">Vault</span>
        </div>
        <div class="action-tile">
          <svg class="tile-glyph" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
          <span class="tile-label">Nodes</span>
        </div>
      </div>

      <!-- In-House Proprietary Live Chart -->
      <div class="market-section-head">Live Market Terminal</div>
      
      <div class="live-chart-card">
        <div class="chart-status-row">
          <div>
            <div class="active-pair-name" id="chartPairTitle">BTC / USDT</div>
            <div style="font-size:10.5px; color:var(--text-mute
