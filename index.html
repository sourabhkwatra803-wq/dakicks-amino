<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>DAKICKS Terminal — TON Ecosystem</title>

  <!-- Core SDKs -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://sad.adsgram.ai/js/sad.min.js" defer></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js" defer></script>

  <style>
    :root {
      --bg-dark: #000000;
      --glass-surface: rgba(18, 18, 22, 0.82);
      --glass-border: rgba(255, 255, 255, 0.1);
      --text-pure: #ffffff;
      --text-secondary: #98989f;
      --accent-ton: #0098EA;
      --accent-glow: rgba(0, 152, 234, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent !important;
      outline: none !important;
      user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-pure);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    div[class*="adsgram"], div[id*="adsgram"] {
      display: none !important;
      opacity: 0 !important;
      pointer-events: none !important;
    }

    .top-bar {
      height: 54px;
      padding: 0 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0, 0, 0, 0.92);
      border-bottom: 1px solid var(--glass-border);
      z-index: 50;
      backdrop-filter: blur(20px);
    }

    .top-left-profile {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .user-avatar-badge {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: linear-gradient(135deg, #0098EA, #14355c);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 12px;
      border: 1px solid rgba(0, 152, 234, 0.4);
      box-shadow: 0 0 12px var(--accent-glow);
      background-size: cover;
      background-position: center;
      overflow: hidden;
    }

    .user-handle-txt {
      font-size: 13px;
      font-weight: 600;
      max-width: 120px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: #ffffff;
    }

    .network-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--text-secondary);
      font-family: -apple-system, monospace;
      background: rgba(0, 152, 234, 0.1);
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid rgba(0, 152, 234, 0.25);
    }

    .network-pill .pulse-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent-ton);
      box-shadow: 0 0 10px var(--accent-ton);
    }

    .main-viewport {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    .tab-content {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      overflow-y: auto;
      padding: 16px 16px 85px 16px;
      z-index: 10;
      scroll-behavior: smooth;
    }

    .tab-content.active {
      display: flex;
    }

    .video-bg-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 1;
      pointer-events: none;
    }

    .video-bg-container video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.32;
      filter: contrast(1.15) brightness(0.75);
    }

    .video-overlay-gradient {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(0, 0, 0, 0.25) 0%, rgba(0, 0, 0, 0.95) 100%);
      z-index: 2;
    }

    #tab-terminal {
      padding: 12px 16px 85px 16px;
      overflow-y: auto;
    }

    .terminal-scroll-wrap {
      display: flex;
      flex-direction: column;
      gap: 14px;
      position: relative;
      z-index: 5;
    }

    .chart-box {
      width: 100%;
      height: 280px;
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--glass-border);
      background: rgba(10, 10, 14, 0.85);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      padding: 14px;
    }

    .chart-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .chart-price-tag {
      font-size: 20px;
      font-weight: 900;
      color: #ffffff;
    }

    .chart-change-tag {
      font-size: 11px;
      font-weight: 800;
      color: #22c55e;
      background: rgba(34, 197, 94, 0.15);
      padding: 3px 8px;
      border-radius: 6px;
    }

    .terminal-stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .t-stat-card {
      background: var(--glass-surface);
      border: 1px solid var(--glass-border);
      border-radius: 14px;
      padding: 14px;
      backdrop-filter: blur(16px);
    }

    .t-stat-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-secondary);
      margin-bottom: 4px;
      font-weight: 700;
    }

    .t-stat-val {
      font-size: 18px;
      font-weight: 900;
      color: #ffffff;
    }

    .section-title {
      font-size: 10.5px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-secondary);
      margin: 4px 0 14px 2px;
      font-weight: 700;
      position: relative;
      z-index: 5;
    }

    .glass-card {
      background: var(--glass-surface);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 14px;
      backdrop-filter: blur(20px);
      position: relative;
      z-index: 5;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .card-3d-sticker {
      position: absolute;
      right: -6px;
      bottom: -8px;
      width: 95px;
      height: 95px;
      pointer-events: none;
      z-index: 6;
      mix-blend-mode: screen;
      opacity: 0.9;
      transform: rotate(-4deg);
    }

    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      position: relative;
      z-index: 7;
    }

    .card-title {
      font-size: 14.5px;
      font-weight: 700;
      color: #ffffff;
    }

    .card-tag {
      font-size: 9px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 4px;
      background: rgba(0, 152, 234, 0.15);
      color: var(--accent-ton);
      border: 1px solid rgba(0, 152, 234, 0.3);
    }

    .card-desc {
      font-size: 12.5px;
      line-height: 1.6;
      color: var(--text-secondary);
      position: relative;
      z-index: 7;
      max-width: 78%;
    }

    .tasks-wrapper {
      position: relative;
      z-index: 5;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .task-card {
      background: var(--glass-surface);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 16px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      backdrop-filter: blur(20px);
    }

    .task-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .task-icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: rgba(0, 152, 234, 0.12);
      border: 1px solid rgba(0, 152, 234, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .task-title {
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
    }

    .task-reward {
      font-size: 12px;
      font-weight: 800;
      color: var(--accent-ton);
      margin-top: 2px;
    }

    .btn-task-action {
      background: #ffffff;
      color: #000000;
      border: none;
      padding: 9px 16px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-task-action.completed {
      background: rgba(255, 255, 255, 0.08);
      color: #8e8e93;
      cursor: default;
      border: 1px solid var(--glass-border);
    }

    .referral-container {
      position: relative;
      z-index: 5;
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding-bottom: 20px;
    }

    .ref-balance-card {
      background: var(--glass-surface);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 24px 20px;
      text-align: center;
      backdrop-filter: blur(24px);
    }

    .ref-bal-title {
      font-size: 12px;
      color: var(--text-secondary);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    .ref-bal-amount {
      font-size: 32px;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: -0.5px;
      margin-bottom: 4px;
    }

    .ref-bal-usd {
      font-size: 13px;
      color: var(--text-secondary);
      font-weight: 600;
      margin-bottom: 18px;
    }

    .btn-goto-wallet {
      background: var(--accent-ton);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      padding: 12px 24px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 0 20px rgba(0, 152, 234, 0.4);
    }

    .ref-banner-card {
      background: var(--glass-surface);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 20px;
      backdrop-filter: blur(24px);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .ref-banner-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .ref-tier-badges {
      display: flex;
      align-items: center;
      gap: -8px;
    }

    .tier-badge-icon {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #1c1c1e;
      border: 2px solid #000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
    }

    .ref-comm-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .ref-comm-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--glass-border);
      border-radius: 14px;
      padding: 16px;
    }

    .ref-comm-pct {
      font-size: 22px;
      font-weight: 900;
      color: var(--accent-ton);
      margin-bottom: 4px;
    }

    .ref-comm-desc {
      font-size: 11.5px;
      color: var(--text-secondary);
      line-height: 1.4;
    }

    .frens-row {
      background: var(--glass-surface);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      backdrop-filter: blur(20px);
      cursor: pointer;
    }

    .frens-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .frens-icon-wrap {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: rgba(0, 152, 234, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    .frens-title {
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
    }

    .frens-count {
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
    }

    .btn-invite-frens-main {
      width: 100%;
      background: #ffffff;
      color: #000000;
      border: none;
      border-radius: 16px;
      padding: 16px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 8px 24px rgba(255, 255, 255, 0.15);
    }

    .vault-wrapper {
      position: relative;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding-top: 8px;
    }

    .vault-glyph {
      width: 72px;
      height: 72px;
      border-radius: 22px;
      background: linear-gradient(145deg, rgba(0, 152, 234, 0.15), rgba(0, 152, 234, 0.03));
      border: 1px solid rgba(0, 152, 234, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      box-shadow: 0 10px 30px rgba(0, 152, 234, 0.25);
    }

    .vault-glyph svg {
      width: 34px;
      height: 34px;
      fill: var(--accent-ton);
    }

    .vault-title {
      font-size: 17px;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 14px;
    }

    .ca-strip {
      width: 100%;
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      backdrop-filter: blur(14px);
    }

    .ca-text {
      font-size: 11px;
      color: var(--text-secondary);
      font-family: -apple-system, monospace;
      font-weight: 600;
    }

    .btn-copy-ca {
      background: var(--accent-ton);
      color: #ffffff;
      border: none;
      padding: 7px 14px;
      border-radius: 7px;
      font-size: 10.5px;
      font-weight: 800;
      cursor: pointer;
    }

    .vault-desc {
      font-size: 12px;
      color: var(--text-secondary);
      line-height: 1.6;
      margin-bottom: 20px;
    }

    .btn-wallet-connect {
      width: 100%;
      background: var(--accent-ton);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 12.5px;
      font-weight: 800;
      letter-spacing: 0.5px;
      cursor: pointer;
      margin-bottom: 18px;
      box-shadow: 0 4px 20px rgba(0, 152, 234, 0.35);
    }

    .allocation-box {
      width: 100%;
      background: var(--glass-surface);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 18px;
      text-align: left;
      backdrop-filter: blur(20px);
      margin-bottom: 14px;
    }

    .alloc-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .alloc-title {
      font-size: 10.5px;
      font-weight: 800;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 1.2px;
    }

    .alloc-status {
      font-size: 9.5px;
      font-weight: 800;
      color: var(--accent-ton);
      background: rgba(0, 152, 234, 0.15);
      padding: 2px 8px;
      border-radius: 6px;
      border: 1px solid rgba(0, 152, 234, 0.3);
    }

    .alloc-value {
      font-size: 26px;
      font-weight: 900;
      color: #ffffff;
      margin-bottom: 14px;
    }

    .btn-claim-ad {
      width: 100%;
      background: linear-gradient(135deg, #0098EA 0%, #0077b5 100%);
      border: none;
      color: #ffffff;
      font-size: 13px;
      font-weight: 800;
      padding: 14px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      cursor: pointer;
      text-transform: uppercase;
      box-shadow: 0 4px 16px rgba(0, 152, 234, 0.3);
    }

    .wallet-modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(16px);
      z-index: 99990;
      display: none;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .wallet-modal-backdrop.show {
      display: block;
      opacity: 1;
    }

    .wallet-modal {
      position: fixed;
      left: 0;
      right: 0;
      bottom: -100%;
      background: #111115;
      border-top: 1px solid rgba(0, 152, 234, 0.3);
      border-radius: 28px 28px 0 0;
      padding: 24px 20px 42px 20px;
      z-index: 99995;
      transition: bottom 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
    }

    .wallet-modal.show {
      bottom: 0;
    }

    .wallet-modal-handle {
      width: 38px;
      height: 4px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 3px;
      margin: 0 auto 18px auto;
    }

    .wallet-modal-title {
      font-size: 18px;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 6px;
      text-align: center;
    }

    .wallet-modal-subtitle {
      font-size: 12px;
      color: var(--text-secondary);
      text-align: center;
      margin-bottom: 20px;
    }

    .wallet-options-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .wallet-option-item {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--glass-border);
      border-radius: 14px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: background 0.2s;
    }

    .wallet-option-item:hover {
      background: rgba(0, 152, 234, 0.08);
      border-color: rgba(0, 152, 234, 0.3);
    }

    .wallet-opt-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .wallet-opt-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: #0098EA;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 15px;
    }

    .wallet-opt-name {
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
    }

    .wallet-opt-desc {
      font-size: 11px;
      color: var(--text-secondary);
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 64px;
      background: rgba(0, 0, 0, 0.95);
      border-top: 1px solid var(--glass-border);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 99;
      backdrop-filter: blur(20px);
    }

    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      color: #636366;
      cursor: pointer;
      height: 100%;
    }

    .nav-item svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    .nav-item.active {
      color: var(--accent-ton);
    }

    .nav-item.active svg {
      fill: var(--accent-ton);
      filter: drop-shadow(0 0 8px rgba(0, 152, 234, 0.6));
    }

    .nav-label {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .hud-toast {
      position: fixed;
      top: 68px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: rgba(18, 22, 28, 0.95);
      border: 1px solid rgba(0, 152, 234, 0.3);
      color: #ffffff;
      padding: 11px 22px;
      border-radius: 30px;
      font-size: 12px;
      font-weight: 700;
      z-index: 999999;
      opacity: 0;
      pointer-events: none;
      backdrop-filter: blur(24px);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      align-items: center;
      gap: 9px;
      white-space: nowrap;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
    }

    .hud-toast.active {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    .hud-toast-indicator {
      width: 6px;
      height: 6px;
