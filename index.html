<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAKICKS Amino</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0b0e14;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            padding: 20px;
            overflow: hidden;
        }
        .header {
            text-align: center;
            margin-top: 10px;
        }
        .brand-title {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 2px;
            color: #00ff66;
            text-transform: uppercase;
        }
        .score-board {
            font-size: 40px;
            font-weight: 900;
            margin-top: 10px;
            color: #ffffff;
        }
        .score-label {
            font-size: 14px;
            color: #8a96a3;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
        }
        .coin-btn {
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, #00ff66 0%, #008f39 100%);
            border: 5px solid #ffffff;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(0, 255, 102, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
            outline: none;
            user-select: none;
        }
        .coin-btn:active {
            transform: scale(0.92);
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.8);
        }
        .nav-bar {
            display: flex;
            justify-content: space-around;
            width: 100%;
            background-color: #161b22;
            padding: 12px;
            border-radius: 15px;
            border: 1px solid #30363d;
        }
        .nav-btn {
            background: none;
            border: none;
            color: #8a96a3;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
        }
        .nav-btn.active {
            color: #00ff66;
        }
        .tasks-container {
            display: none;
            flex-direction: column;
            width: 100%;
            flex-grow: 1;
            padding: 10px 0;
            overflow-y: auto;
        }
        .task-card {
            background-color: #161b22;
            border: 1px solid #30363d;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .task-info h4 {
            font-size: 16px;
            margin-bottom: 4px;
        }
        .task-info p {
            font-size: 12px;
            color: #00ff66;
        }
        .task-action-btn {
            background-color: #00ff66;
            color: #0b0e14;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="brand-title">DAKICKS Amino</div>
        <div class="score-board" id="score">0</div>
        <div class="score-label">$DKX Points</div>
    </div>

    <!-- Game Screen (Tapper) -->
    <div class="game-container" id="gameScreen">
        <button class="coin-btn" id="tapBtn">👟</button>
    </div>

    <!-- Tasks Screen -->
    <div class="tasks-container" id="tasksScreen">
        <h3 style="margin-bottom: 15px; font-size: 18px;">Earn More Points</h3>
        
        <div class="task-card">
            <div class="task-info">
                <h4>Join Telegram Channel</h4>
                <p>+5,000 Points</p>
            </div>
            <a href="https://t.me/YOUR_CHANNEL_LINK" target="_blank" class="task-action-btn">Start</a>
        </div>

        <div class="task-card">
            <div class="task-info">
                <h4>Follow on Instagram</h4>
                <p>+5,000 Points</p>
            </div>
            <a href="https://instagram.com/YOUR_INSTAGRAM" target="_blank" class="task-action-btn">Follow</a>
        </div>

        <div class="task-card">
            <div class="task-info">
                <h4>Follow on X (Twitter)</h4>
                <p>+5,000 Points</p>
            </div>
            <a href="https://twitter.com/YOUR_X_HANDLE" target="_blank" class="task-action-btn">Follow</a>
        </div>
    </div>

    <!-- Navigation Bar -->
    <div class="nav-bar">
        <button class="nav-btn active" onclick="switchTab('game')">⚡ Mine</button>
        <button class="nav-btn" onclick="switchTab('tasks')">📋 Tasks</button>
    </div>

    <script>
        let score = localStorage.getItem('dkx_score') ? parseInt(localStorage.getItem('dkx_score')) : 0;
        const scoreDisplay = document.getElementById('score');
        const tapBtn = document.getElementById('tapBtn');
        
        scoreDisplay.innerText = score;

        tapBtn.addEventListener('click', () => {
            score += 1;
            scoreDisplay.innerText = score;
            localStorage.setItem('dkx_score', score);
        });

        function switchTab(tab) {
            const gameScreen = document.getElementById('gameScreen');
            const tasksScreen = document.getElementById('tasksScreen');
            const buttons = document.querySelectorAll('.nav-btn');

            buttons.forEach(btn => btn.classList.remove('active'));

            if (tab === 'game') {
                gameScreen.style.display = 'flex';
                tasksScreen.style.display = 'none';
                buttons[0].classList.add('active');
            } else {
                gameScreen.style.display = 'none';
                tasksScreen.style.display = 'flex';
                buttons[1].classList.add('active');
            }
        }
    </script>
</body>
</html>
