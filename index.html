<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>DKX Institutional Terminal</title>
  
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Adsgram SDK -->
  <script src="https://sad.adsgram.ai/js/sad.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #030704;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: 24px;
    }

    /* Top Navigation */
    .header {
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(0, 255, 136, 0.15);
      background: rgba(3, 7, 4, 0.95);
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(8px);
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: linear-gradient(135deg, #00ff88, #00b359);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      color: #030704;
      font-size: 16px;
      box-shadow: 0 0 12px rgba(0, 255, 136, 0.4);
    }

    .brand-info h1 {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #ffffff;
      text-transform: uppercase;
    }

    .brand-info span {
      font-size: 10px;
      color: #00ff88;
      font-weight: 600;
      letter-spacing: 1px;
    }

    .user-pill {
      font-size: 12px;
      background: rgba(255, 255, 255, 0.06);
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .user-pill .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #00ff88;
      box-shadow: 0 0 6px #00ff88;
    }

    /* Balance & Reward Card */
    .balance-card {
      margin: 16px;
      padding: 16px;
      border-radius: 14px;
      background: linear-gradient(180deg, rgba(16, 28, 19, 0.8) 0%, rgba(6, 14, 8, 0.9) 100%);
      border: 1px solid rgba(0, 255, 136, 0.2);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .balance-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 14px;
    }

    .balance-title {
      font-size: 11px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .balance-val {
      font-size: 26px;
      font-weight: 800;
      color: #00ff88;
      margin-top: 4px;
      text-shadow: 0 0 10px rgba(0, 255, 136, 0.25);
    }

    .balance-sub {
      font-size: 11px;
      color: #64748b;
    }

    /* Ad Action Button */
    .ad-btn {
      width: 100%;
      background: linear-gradient(90deg, #00e5ff 0%, #00ff88 100%);
      border: none;
      color: #030704;
      font-size: 14px;
      font-weight: 700;
      padding: 12px 16px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 229, 255, 0.25);
      transition: transform 0.1s ease, filter 0.2s ease;
    }

    .ad-btn:active {
      transform: scale(0.98);
      filter: brightness(0.9);
    }

    /* Chart Section */
    .chart-container {
      margin: 0 16px 16px 16px;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: #080d09;
      height: 320px;
    }

    /* Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 0 16px 16px 16px;
    }

    .stat-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.07);
      padding: 12px;
      border-radius: 10px;
    }

    .stat-label {
      font-size: 11px;
      color: #94a3b8;
      margin-bottom: 4px;
    }

    .stat-value {
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
    }

    .stat-tag {
      font-size: 10px;
      color: #00ff88;
      font-weight: 600;
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #0f2416;
      border: 1px solid #00ff88;
      color: #00ff88;
      padding: 10px 18px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
      transition: transform 0.3s ease;
      z-index: 100;
      white-space: nowrap;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="brand-group">
      <div class="brand-logo">D</div>
      <div class="brand-info">
        <h1>DKX Terminal</h1>
        <span>INSTITUTIONAL RWA</span>
      </div>
    </div>
    <div class="user-pill" id="userPill">
      <div class="dot"></div>
      <span id="userName">Terminal User</span>
    </div>
  </div>

  <!-- Balance & Adsgram Section -->
  <div class="balance-card">
    <div class="balance-row">
      <div>
        <div class="balance-title">DKX Trading Balance</div>
        <div class="balance-val" id="dkxBalance">1,250 <span style="font-size: 14px; font-weight: 600;">DKX</span></div>
      </div>
      <div class="balance-sub" id="usdValue">≈ $3,125.00 USD</div>
    </div>

    <!-- Watch Ad Button -->
    <button class="ad-btn" id="watchAdBtn">
      <span>▶</span> Watch Ad & Earn 50 DKX
    </button>
  </div>

  <!-- Live TradingView Chart -->
  <div class="chart-container">
    <!-- TradingView Widget BEGIN -->
    <div class="tradingview-widget-container" style="height:100%;width:100%">
      <div id="tradingview_chart" style="height:calc(100% - 32px);width:100%"></div>
      <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
      <script type="text/javascript">
      new TradingView.widget({
        "autosize": true,
        "symbol": "BINANCE:BTCUSDT",
        "interval": "15",
        "timezone": "Etc/UTC",
        "theme": "dark",
        "style": "1",
        "locale": "en",
        "enable_publishing": false,
        "backgroundColor": "#080d09",
        "gridColor": "rgba(255, 255, 255, 0.05)",
        "hide_top_toolbar": true,
        "save_image": false,
        "container_id": "tradingview_chart"
      });
      </script>
    </div>
    <!-- TradingView Widget END -->
  </div>

  <!-- Terminal Quick Stats -->
  <div class="stats-grid">
    <div class="stat-box">
      <div class="stat-label">DKX/USDT Index</div>
      <div class="stat-value">$2.50</div>
      <div class="stat-tag">+4.82% 24h</div>
    </div>
    <div class="stat-box">
      <div class="stat-label">RWA Vault Collateral</div>
      <div class="stat-value">$18.4M</div>
      <div class="stat-tag">99.8% Backed</div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="toast">Reward Claimed! +50 DKX</div>

  <script>
    // 1. Initialize Telegram Mini App
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      if (tg.initDataUnsafe?.user?.first_name) {
        document.getElementById('userName').innerText = tg.initDataUnsafe.user.first_name;
      }
    }

    // 2. Initialize Adsgram with your UnitID / Block ID
    const AdController = window.Adsgram ? window.Adsgram.init({ blockId: "46161" }) : null;

    let balance = 1250;
    const balanceElem = document.getElementById('dkxBalance');
    const usdElem = document.getElementById('usdValue');
    const toastElem = document.getElementById('toast');

    function showToast(msg) {
      toastElem.innerText = msg;
      toastElem.classList.add('show');
      setTimeout(() => {
        toastElem.classList.remove('show');
      }, 3000);
    }

    // 3. Handle Ad Watch & Reward
    document.getElementById('watchAdBtn').addEventListener('click', () => {
      if (tg?.HapticFeedback) {
        tg.HapticFeedback.impactOccurred('medium');
      }

      if (!AdController) {
        alert("Adsgram SDK is loading or not available in this environment.");
        return;
      }

      // Show Rewarded Video Ad
      AdController.show().then((result) => {
        // User watched ad successfully
        balance += 50;
        balanceElem.innerHTML = `${balance.toLocaleString()} <span style="font-size: 14px; font-weight: 600;">DKX</span>`;
        usdElem.innerText = `≈ $${(balance * 2.5).toFixed(2)} USD`;
        
        if (tg?.HapticFeedback) {
          tg.HapticFeedback.notificationOccurred('success');
        }
        showToast("🎉 Reward Claimed! +50 DKX Added.");
      }).catch((result) => {
        // User skipped or ad failed
        console.log("Ad skipped or failed:", result);
        showToast("⚠️ Watch the full ad to claim reward!");
      });
    });
  </script>
</body>
</html>
