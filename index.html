<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>DAKICKS® Terminal — RWA Intelligence</title>

<meta name="theme-color" content="#050507">
<meta name="description" content="DAKICKS® high-end cryptographic RWA terminal on BNB Smart Chain">

<!-- =========================================================
     EXTERNAL LIBRARIES
========================================================= -->

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.2/dist/ethers.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.min.js"></script>

<style>
/* =========================================================
   RESET
========================================================= */

*,
*::before,
*::after{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
    padding:0;
    overflow:hidden;
    background:#050507;
    color:#f4f7f5;
    font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

button,
input{
    font:inherit;
}

button{
    border:0;
    cursor:pointer;
}

a{
    color:inherit;
    text-decoration:none;
}

/* =========================================================
   ROOT
========================================================= */

:root{
    --bg:#050507;
    --panel:rgba(13,16,15,.78);
    --panel2:rgba(18,22,20,.72);
    --line:rgba(190,210,201,.16);
    --line2:rgba(255,255,255,.09);

    --white:#f4f7f5;
    --muted:#8e9c96;
    --muted2:#66726d;

    --green:#00f59b;
    --green2:#00c77e;
    --green-soft:rgba(0,245,155,.12);

    --danger:#ff4050;

    --radius:25px;
    --nav-height:88px;
    --header-height:98px;

    --shadow:
        0 30px 90px rgba(0,0,0,.55),
        inset 0 1px 0 rgba(255,255,255,.04);
}

/* =========================================================
   APP SHELL
========================================================= */

#app{
    position:relative;
    width:100%;
    height:100dvh;
    overflow:hidden;
    background:
        radial-gradient(circle at 20% 10%,rgba(0,255,170,.045),transparent 28%),
        radial-gradient(circle at 90% 70%,rgba(0,255,170,.025),transparent 30%),
        #050507;
}

#threeCanvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    opacity:.72;
    pointer-events:none;
    z-index:1;
}

#grain{
    position:absolute;
    inset:-100%;
    z-index:2;
    pointer-events:none;
    opacity:.035;
    background-image:
        url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.5'/%3E%3C/svg%3E");
    animation:grain .25s steps(2) infinite;
}

@keyframes grain{
    0%{transform:translate(0,0)}
    25%{transform:translate(2%,-3%)}
    50%{transform:translate(-3%,2%)}
    75%{transform:translate(3%,3%)}
    100%{transform:translate(-2%,-2%)}
}

/* =========================================================
   BACKGROUND VIDEO
========================================================= */

#bgVideo{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:0;
    opacity:.14;
    filter:
        saturate(.55)
        contrast(1.2)
        brightness(.55);
    pointer-events:none;
    transition:opacity .5s ease;
}

.video-vignette{
    position:absolute;
    inset:0;
    z-index:3;
    pointer-events:none;
    background:
        linear-gradient(
            180deg,
            rgba(0,0,0,.76) 0%,
            rgba(0,0,0,.18) 22%,
            rgba(0,0,0,.1) 55%,
            rgba(0,0,0,.78) 100%
        );
}

/* =========================================================
   HEADER
========================================================= */

.app-header{
    position:absolute;
    left:0;
    right:0;
    top:0;
    height:var(--header-height);
    z-index:20;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:
        max(14px,env(safe-area-inset-top))
        22px
        8px;

    background:
        linear-gradient(
            180deg,
            rgba(2,3,3,.96),
            rgba(3,4,4,.84)
        );

    border-bottom:1px solid rgba(255,255,255,.07);
    backdrop-filter:blur(22px);
    -webkit-backdrop-filter:blur(22px);
}

.header-left{
    display:flex;
    align-items:center;
    gap:15px;
}

.close-button,
.menu-button,
.header-chevron{
    width:44px;
    height:44px;
    display:grid;
    place-items:center;
    background:transparent;
    color:white;
}

.close-button{
    font-size:34px;
    font-weight:200;
}

.brand-title{
    font-size:23px;
    font-weight:850;
    letter-spacing:-.6px;
}

.header-right{
    display:flex;
    align-items:center;
    gap:3px;
}

.header-chevron{
    font-size:30px;
}

.menu-button{
    font-size:29px;
}

.profile-trigger{
    display:flex;
    align-items:center;
    gap:12px;
    padding:5px 8px 5px 0;
    background:transparent;
    color:white;
}

.avatar{
    width:47px;
    height:47px;
    border-radius:50%;
    object-fit:cover;
    border:1px solid rgba(255,255,255,.55);
    box-shadow:
        0 0 0 1px rgba(0,245,155,.05),
        0 0 24px rgba(0,245,155,.13);
    background:#1c211f;
}

.profile-name{
    font-size:17px;
    font-weight:750;
}

.wallet-mini{
    display:flex;
    align-items:center;
    gap:9px;
    color:#94a19b;
    font-size:15px;
}

.wallet-dot{
    width:12px;
    height:12px;
    border-radius:50%;
    background:var(--green);
    box-shadow:0 0 17px var(--green);
}

/* =========================================================
   PAGE ENGINE
========================================================= */

#pages{
    position:absolute;
    inset:
        var(--header-height)
        0
        var(--nav-height)
        0;
    z-index:10;
    overflow:hidden;
}

.page{
    position:absolute;
    inset:0;
    overflow-y:auto;
    overflow-x:hidden;
    padding:25px 20px 55px;
    opacity:0;
    transform:translateX(24px) scale(.985);
    pointer-events:none;
    transition:
        opacity .34s ease,
        transform .42s cubic-bezier(.2,.8,.2,1);
    scrollbar-width:none;
}

.page::-webkit-scrollbar{
    display:none;
}

.page.active{
    opacity:1;
    transform:none;
    pointer-events:auto;
}

/* =========================================================
   SECTION LABEL
========================================================= */

.section-label{
    margin:11px 14px 26px;
    color:#93a29b;
    font-size:13px;
    font-weight:850;
    letter-spacing:3px;
}

/* =========================================================
   GLASS CARDS
========================================================= */

.glass{
    position:relative;
    overflow:hidden;

    border:1px solid var(--line);
    border-radius:var(--radius);

    background:
        linear-gradient(
            145deg,
            rgba(22,27,25,.84),
            rgba(8,10,10,.78)
        );

    box-shadow:var(--shadow);

    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
}

.glass::before{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;

    background:
        linear-gradient(
            120deg,
            rgba(255,255,255,.055),
            transparent 23%,
            transparent 70%,
            rgba(255,255,255,.018)
        );
}

.glow-line{
    position:absolute;
    left:12%;
    right:12%;
    top:0;
    height:1px;
    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(0,245,155,.55),
            transparent
        );
    filter:blur(.5px);
}

/* =========================================================
   TERMINAL
========================================================= */

.terminal-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:14px;
}

.symbol-selector{
    display:flex;
    align-items:center;
    gap:12px;
    min-width:0;
}

.search-icon{
    width:25px;
    height:25px;
    border:3px solid #e7ece9;
    border-radius:50%;
    position:relative;
}

.search-icon::after{
    content:"";
    position:absolute;
    width:9px;
    height:3px;
    background:#e7ece9;
    transform:rotate(45deg);
    right:-7px;
    bottom:-4px;
}

.symbol{
    font-weight:800;
    font-size:18px;
}

.add-symbol{
    width:38px;
    height:38px;
    border:1px solid rgba(255,255,255,.24);
    border-radius:50%;
    background:rgba(255,255,255,.025);
    color:white;
    font-size:26px;
}

.timeframes{
    display:flex;
    align-items:center;
    gap:3px;
    overflow:hidden;
}

.timeframe{
    padding:10px 12px;
    border-radius:11px;
    background:transparent;
    color:#d4d9d7;
    font-size:14px;
}

.timeframe.active{
    background:rgba(255,255,255,.18);
}

.chart-shell{
    height:590px;
    min-height:500px;
    border-radius:25px;
    overflow:hidden;
    border:1px solid rgba(255,255,255,.1);
    background:#060707;
    box-shadow:
        inset 0 0 80px rgba(0,0,0,.7),
        0 25px 80px rgba(0,0,0,.4);
}

#tradingview_chart{
    width:100%;
    height:100%;
}

/* =========================================================
   DAKICKS RWA
========================================================= */

.rwa-grid{
    display:grid;
    gap:17px;
}

.rwa-card{
    min-height:206px;
    padding:28px 28px 25px;
    perspective:1000px;
}

.rwa-card-content{
    position:relative;
    z-index:3;
    width:78%;
}

.rwa-title{
    font-size:25px;
    font-weight:850;
    margin-bottom:17px;
    letter-spacing:-.6px;
}

.rwa-description{
    color:#a1afa8;
    font-size:17px;
    line-height:1.65;
}

.badge{
    position:absolute;
    right:25px;
    top:28px;
    z-index:4;

    padding:8px 13px;

    border:1px solid rgba(255,255,255,.17);
    border-radius:8px;

    background:rgba(255,255,255,.075);

    color:#d9dfdc;
    font-size:12px;
    font-weight:850;
}

.rwa-coin{
    position:absolute;
    right:32px;
    bottom:28px;
    width:72px;
    height:72px;
    border-radius:50%;

    display:grid;
    place-items:center;

    font-weight:900;
    font-size:27px;

    color:#101211;

    background:
        radial-gradient(
            circle at 30% 28%,
            #fff,
            #aeb4b0 42%,
            #555b58 70%,
            #1a1c1b
        );

    border:2px solid #d4d9d6;

    box-shadow:
        0 12px 40px rgba(0,0,0,.7),
        inset 5px 5px 12px rgba(255,255,255,.7),
        inset -7px -7px 15px rgba(0,0,0,.65);

    transform-style:preserve-3d;
    animation:coinFloat 4s ease-in-out infinite;
}

.rwa-coin::after{
    content:"D";
    width:46px;
    height:46px;
    display:grid;
    place-items:center;
    border:1px solid rgba(0,0,0,.28);
    border-radius:50%;
    transform:translateZ(5px);
}

@keyframes coinFloat{
    0%,100%{transform:translateY(0) rotateY(0deg)}
    50%{transform:translateY(-7px) rotateY(180deg)}
}

.card-video{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    opacity:.12;
    mix-blend-mode:screen;
    pointer-events:none;
}

/* =========================================================
   COMMUNITY
========================================================= */

.social-stack{
    display:grid;
    gap:17px;
}

.social-card{
    min-height:126px;
    display:flex;
    align-items:center;
    gap:20px;
    padding:20px 20px 20px 25px;
}

.social-icon{
    width:64px;
    height:64px;
    flex:0 0 64px;
    display:grid;
    place-items:center;

    border-radius:20px;
    border:1px solid rgba(255,255,255,.13);
    background:rgba(255,255,255,.035);

    font-size:29px;
    font-weight:900;
}

.social-info{
    min-width:0;
    flex:1;
}

.social-title{
    font-size:20px;
    font-weight:850;
    margin-bottom:4px;
}

.social-handle{
    color:#9ba7a2;
    font-size:17px;
}

.open-node{
    min-width:143px;
    height:57px;
    padding:0 18px;
    border-radius:17px;
    border:1px solid rgba(255,255,255,.16);
    background:rgba(255,255,255,.055);
    color:#f3f5f4;
    font-weight:800;
    font-size:16px;
}

.open-node:active{
    transform:scale(.97);
}

.x-card{
    overflow:hidden;
}

.x-card .squirrel-video{
    position:absolute;
    right:20px;
    top:8px;
    width:92px;
    height:92px;
    object-fit:cover;
    border-radius:50%;
    opacity:.22;
    mix-blend-mode:screen;
    pointer-events:none;
}

/* =========================================================
   VAULT
========================================================= */

.vault-hero{
    padding:35px 25px 30px;
    text-align:center;
    margin-bottom:18px;
}

.shield{
    width:100px;
    height:100px;
    margin:0 auto 28px;

    display:grid;
    place-items:center;

    border-radius:31px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.12),
            rgba(255,255,255,.025)
        );

    border:1px solid rgba(255,255,255,.18);

    box-shadow:
        0 25px 80px rgba(0,0,0,.7),
        inset 0 1px 0 rgba(255,255,255,.08);

    font-size:47px;

    transform-style:preserve-3d;
    animation:shieldFloat 5s ease-in-out infinite;
}

@keyframes shieldFloat{
    0%,100%{
        transform:translateY(0) rotateX(0) rotateY(0);
    }
    50%{
        transform:translateY(-8px) rotateX(5deg) rotateY(-8deg);
    }
}

.vault-title{
    font-size:27px;
    font-weight:900;
    letter-spacing:-.8px;
}

.vault-sub{
    color:#9aa8a1;
    font-size:15px;
    line-height:1.7;
    margin:13px auto 0;
    max-width:500px;
}

.ca-box{
    margin:0 0 18px;
    padding:19px;

    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;

    border-radius:22px;
    background:rgba(0,0,0,.48);
    border:1px solid rgba(255,255,255,.13);
}

.ca-text{
    min-width:0;
    overflow:hidden;
}

.ca-label{
    color:#94a39b;
    font-size:12px;
    letter-spacing:1.6px;
    font-weight:800;
    margin-bottom:8px;
}

.ca-value{
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    font-family:monospace;
    color:#dbe3df;
    font-size:14px;
}

.primary-button{
    min-height:62px;
    width:100%;

    border-radius:20px;

    background:
        linear-gradient(
            135deg,
            #ffffff,
            #cdd8e4
        );

    color:#090b0a;

    font-size:16px;
    font-weight:900;
    letter-spacing:.7px;

    box-shadow:
        0 15px 50px rgba(0,0,0,.4),
        inset 0 1px 0 white;

    transition:
        transform .2s ease,
        box-shadow .2s ease;
}

.primary-button:hover{
    box-shadow:
        0 20px 70px rgba(0,0,0,.6),
        0 0 30px rgba(255,255,255,.1);
}

.primary-button:active{
    transform:scale(.985);
}

.primary-button.connected{
    background:
        linear-gradient(
            135deg,
            #00f59b,
            #00bd7b
        );
}

.allocation-card{
    padding:28px 25px;
    margin-top:18px;
}

.card-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    margin-bottom:18px;
}

.card-label{
    color:#93a29b;
    letter-spacing:2px;
    font-weight:850;
    font-size:13px;
}

.online{
    color:var(--green);
    font-size:14px;
    font-weight:900;
}

.amount{
    font-size:48px;
    font-weight:900;
    letter-spacing:-2px;
    margin-bottom:25px;
}

.amount span{
    font-size:18px;
    color:#89968f;
    letter-spacing:0;
}

.claim-button{
    width:100%;
    min-height:64px;
    border-radius:19px;

    background:
        linear-gradient(
            135deg,
            #ffffff,
            #d6e0eb
        );

    color:#080a09;
    font-size:17px;
    font-weight:900;
}

.claim-button:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.allocations{
    margin-top:18px;
    padding:25px;
}

.verified-badge{
    border:1px solid rgba(0,245,155,.45);
    background:rgba(0,245,155,.08);
    color:var(--green);
    padding:8px 12px;
    border-radius:99px;
    font-size:12px;
    font-weight:850;
}

.allocation-row{
    display:grid;
    grid-template-columns:1fr auto auto;
    gap:15px;
    align-items:center;
    padding:16px 0;
    border-bottom:1px solid rgba(255,255,255,.055);
    font-family:monospace;
}

.allocation-row:last-child{
    border-bottom:0;
}

.allocation-address{
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    color:#bbc4c0;
}

.allocation-value{
    color:var(--green);
    font-weight:900;
}

.allocation-time{
    color:#65716c;
    font-family:inherit;
}

/* =========================================================
   BOTTOM NAV
========================================================= */

.bottom-nav{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:var(--nav-height);
    z-index:30;

    display:grid;
    grid-template-columns:repeat(4,1fr);

    padding:
        7px
        10px
        max(8px,env(safe-area-inset-bottom));

    background:
        linear-gradient(
            180deg,
            rgba(3,5,4,.87),
            rgba(2,3,3,.98)
        );

    border-top:1px solid rgba(255,255,255,.08);
    backdrop-filter:blur(24px);
    -webkit-backdrop-filter:blur(24px);
}

.nav-button{
    position:relative;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:5px;

    color:#59645f;
    background:transparent;

    transition:
        color .25s ease,
        transform .25s ease;
}

.nav-button.active{
    color:#f2f5f3;
}

.nav-button.active::before{
    content:"";
    position:absolute;
    top:-7px;
    width:42px;
    height:2px;
    border-radius:9px;
    background:var(--green);
    box-shadow:0 0 17px rgba(0,245,155,.75);
}

.nav-icon{
    width:27px;
    height:27px;
    display:grid;
    place-items:center;
    font-size:23px;
}

.nav-label{
    font-size:12px;
    letter-spacing:1.7px;
    font-weight:900;
}

/* =========================================================
   PROFILE MODAL
========================================================= */

.modal-layer{
    position:fixed;
    inset:0;
    z-index:100;

    display:flex;
    align-items:flex-end;
    justify-content:center;

    background:rgba(0,0,0,.72);

    opacity:0;
    visibility:hidden;
    transition:.3s ease;

    backdrop-filter:blur(12px);
}

.modal-layer.open{
    opacity:1;
    visibility:visible;
}

.profile-modal{
    width:min(100%,620px);
    max-height:92dvh;
    overflow:auto;

    padding:
        14px
        25px
        max(30px,env(safe-area-inset-bottom));

    border-radius:34px 34px 0 0;

    border:1px solid rgba(255,255,255,.13);
    border-bottom:0;

    background:
        linear-gradient(
            160deg,
            rgba(17,21,19,.98),
            rgba(6,8,8,.99)
        );

    transform:translateY(100%);
    transition:
        transform .45s cubic-bezier(.2,.85,.2,1);

    box-shadow:
        0 -30px 100px rgba(0,0,0,.75);
}

.modal-layer.open .profile-modal{
    transform:translateY(0);
}

.drag-handle{
    width:74px;
    height:5px;
    border-radius:20px;
    background:#3b4541;
    margin:0 auto 20px;
}

.modal-top{
    display:flex;
    justify-content:flex-end;
}

.modal-close{
    width:42px;
    height:42px;
    border-radius:50%;
    background:rgba(255,255,255,.05);
    color:white;
    font-size:25px;
}

.profile-center{
    text-align:center;
}

.big-avatar-wrap{
    position:relative;
    width:126px;
    height:126px;
    margin:12px auto 20px;
}

.big-ava
