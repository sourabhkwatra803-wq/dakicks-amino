<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>DAKICKS — High-Concurrency Terminal</title>
  
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    :root {
      --bg-dark: #000000;
      --accent-ton: #0098EA;
      --text-pure: #ffffff;
      --text-secondary: #98989f;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: var(--bg-dark);
      color: var(--text-pure);
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 30px 20px;
      overflow: hidden;
    }
    .header {
      text-align: center;
    }
    .balance {
      font-size: 38px;
      font-weight: 900;
      letter-spacing: -1px;
      margin-top: 6px;
    }
    .tap-container {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 260px;
      height: 260px;
    }
    .tap-btn {
      width: 230px;
      height: 230px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #0098EA, #0a2540);
      border: 2px solid rgba(0, 152, 234, 0.6);
      box-shadow: 0 0 50px rgba(0, 152, 234, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 900;
      color: #fff;
      cursor: pointer;
      transition: transform 0.05s ease;
    }
    .tap-btn:active {
      transform: scale(0.95);
    }
    .footer-info {
      font-size: 12px;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }
  </style>
</head>
<body>

  <div class="header">
    <div style="font-size: 13px; color: var(--text-secondary); font-weight: 700;">$DKX MINING CORE</div>
    <div class="balance" id="balanceVal">1,250</div>
  </div>

  <div class="tap-container">
    <div class="tap-btn" id="tapButton">TAP</div>
  </div>

  <div class="footer-info">
    Notcoin Architecture Node v1.0
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    let score = 1250;
    let pendingClicks = 0;
    const balanceElem = document.getElementById('balanceVal');
    const tapButton = document.getElementById('tapButton');

    // High-performance local click handler with haptic feedback
    tapButton.addEventListener('pointerdown', (e) => {
      if (tg?.HapticFeedback) {
        tg.HapticFeedback.impactOccurred('light');
      }

      score += 1;
      pendingClicks += 1;
      balanceElem.innerText = score.toLocaleString();
    });

    // Batch sync mechanism to prevent network flooding (Notcoin style)
    setInterval(() => {
      if (pendingClicks > 0) {
        const batch = pendingClicks;
        pendingClicks = 0;
        
        // Background sync simulation (will connect to cloud worker API next)
        console.log(`Synced batch of ${batch} clicks to scaling queue.`);
      }
    }, 2000);
  </script>

</body>
</html>
